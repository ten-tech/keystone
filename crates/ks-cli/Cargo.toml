[package]
name = "ks-cli"
description = "La CLI `ks` — surface de référence de Keystone. L'interface graphique n'en est qu'un client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "ks"
path = "src/main.rs"

[dependencies]
ks-core.workspace = true
ks-collectors.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true

# Persistance du journal (Phase 0.5). Ici la base nous appartient : elle
# s'ouvre en ecriture et en mode WAL, a l'inverse du lecteur des bases de
# winget, qui n'a le droit de deposer aucun fichier annexe.
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Lecture de `workstation.yaml` (ADR-0016). Le crate n'entre QUE dans ce crate-ci :
# `ks-core` porte les types du désir, `ks-cli` porte le fichier.
#
# **Ce que cette ligne coûte, et qu'il faut avoir sous les yeux.** La
# fonctionnalité `deserialize` tire `num-traits`, `annotate-snippets`,
# `granit-parser`, `smallvec` et `encoding_rs_io` — donc aussi `encoding_rs`,
# `anstyle`, `unicode-width`, `arraydeque`, `cfg-if`. C'est beaucoup pour lire
# une table plate, et `encoding_rs` contient du code `unsafe` qui entre ainsi
# dans l'arbre de ce crate, lequel déclare pourtant `unsafe_code = "forbid"`
# pour son propre code. Le `forbid` n'a jamais couvert les dépendances ; le coût
# est réel, il est consigné par l'ADR-0016, et il est répété ici pour qu'on
# cesse de le redécouvrir.
serde-saphyr.workspace = true

# Génération du schéma JSON depuis les types de `etat_desire` (ADR-0010,
# décision n° 2). Le crate n'entre QUE dans celui-ci : voir la note du
# `Cargo.toml` racine pour la raison, qui tient à `ks-broker`.
schemars.workspace = true

[lints.rust]
unsafe_code = "forbid"
