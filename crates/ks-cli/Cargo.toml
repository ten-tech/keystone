[package]
name = "ks-cli"
description = "La CLI `ks` — surface de référence de Keystone. L'interface graphique n'en est qu'un client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "ks"
path = "src/main.rs"

[dependencies]
ks-core.workspace = true
ks-collectors.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true

# Persistance du journal (Phase 0.5). Ici la base nous appartient : elle
# s'ouvre en ecriture et en mode WAL, a l'inverse du lecteur des bases de
# winget, qui n'a le droit de deposer aucun fichier annexe.
rusqlite.workspace = true
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"
