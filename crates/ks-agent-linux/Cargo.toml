[package]
name = "ks-agent-linux"
description = "Agent Keystone pour les distributions WSL2 et les VM Linux. Même protocole que l'hôte."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "ks-agent"
path = "src/main.rs"

[dependencies]
# `ks-core` n'est pas déclaré : l'agent ne l'importe pas directement, il ne
# manipule que l'`Inventory` de `ks-collectors`, qui en dépend déjà. Le déclarer
# ne coûtait rien en compilation mais décrivait une dépendance qui n'existe pas.
ks-collectors.workspace = true
anyhow.workspace = true
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"
