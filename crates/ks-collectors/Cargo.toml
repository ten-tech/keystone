[package]
name = "ks-collectors"
description = "Collecteurs Keystone — LECTURE SEULE. Aucun collecteur n'a le droit d'écrire."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ks-core.workspace = true
chrono.workspace = true
serde.workspace = true
sysinfo.workspace = true

# `windows-registry` et non `windows` : la réconciliation d'inventaire logiciel
# ne lit que le registre, et ce crate en offre une API SÛRE. Le choix n'est pas
# cosmétique — il garde toute la Phase 0.3 hors du régime `unsafe`, donc hors du
# débat sur le grain des exceptions, qui reste à trancher pour la 0.2.
#
# Version vérifiée à la source le 2026-08-02 : 0.6.1, MSRV 1.82 (sous notre 1.85),
# « MIT OR Apache-2.0 » déjà autorisée par deny.toml. Même famille que le crate
# `windows` qu'exigera la 0.2 : une seule chaîne d'approvisionnement à auditer.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[lints.rust]
# Aucun bloc `unsafe` à ce jour : `windows-registry` est une API sûre. Le `warn`
# reste posé pour la 0.2, où les appels TPM et WMI l'imposeront — et chaque bloc
# devra alors porter son commentaire `// SAFETY:`.
unsafe_code = "warn"
