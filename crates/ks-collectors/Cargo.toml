[package]
name = "ks-collectors"
description = "Collecteurs Keystone — LECTURE SEULE. Aucun collecteur n'a le droit d'écrire."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ks-core.workspace = true
chrono.workspace = true
serde.workspace = true
sysinfo.workspace = true

# Les collecteurs spécifiques à Windows (TPM, BitLocker, Defender, WMI, registre)
# arrivent en Phase 0.2. Le crate `windows` était déjà déclaré ici « pour que la
# cible soit explicite » — mais jamais importé, ce qui compilait neuf crates
# transitives pour rien et figeait une version d'API qu'on n'a pas encore essayée.
#
# Il sera ajouté au moment du premier appel Win32 réel, avec la version stable
# vérifiée à la source ce jour-là. Rien à déclarer avant d'en avoir besoin.

[lints.rust]
unsafe_code = "warn"   # inévitable côté Win32, mais chaque bloc doit être justifié.
