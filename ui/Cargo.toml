# Workspace SÉPARÉ de celui de la racine, délibérément.
#
# La coque Tauri tire ~415 crates ; le workspace principal en compte 123. Les
# réunir ferait payer cet arbre à chaque `cargo test --workspace` du noyau et à
# chaque job de CI, et placerait le verrou du produit sous la dépendance de
# `wry`, de `webkit2gtk` et de leur cortège. La racine porte donc
# `exclude = ["ui"]`, et ce verrou-ci est le seul à connaître Tauri.
#
# La dépendance ne va que dans un sens : `ks-ui` consomme `crates/ks-cli` et
# `crates/ks-collectors` par chemin. Aucun crate de la racine ne connaît `ui/`.
[workspace]
# Résolveur 3, pour la même raison qu'à la racine. Il a d'abord servi à tenir la
# MSRV 1.85 : l'arbre transitif de Tauri 2.11 contient `darling_macro`
# (rust-version 1.88) et `icu_collections` (1.86) ; en résolveur 2 ils étaient
# sélectionnés et la compilation échouait sous 1.85. Le résolveur 3 lit leur
# `rust-version` et retient des versions antérieures. Vérifié en compilant sous
# cargo 1.85.0, pas déduit.
#
# Depuis l'ADR-0016, la MSRV du projet est 1.88 et ces deux crates ne sont donc
# plus une contrainte. Le résolveur 3 reste : il n'a pas cessé d'écarter tout ce
# qui déclare au-dessus de 1.88, et le retirer rouvrirait la porte à l'instant
# où une dépendance passera 1.99.
resolver = "3"
members = ["ks-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Alignée sur celle du workspace principal : `ks-ui` consomme ses crates, il ne
# peut pas exiger moins. Elle se mesure ici aussi, elle ne s'estime pas.
#
# Passée de 1.85 à 1.88 avec elle (ADR-0016), et pas par symétrie : `ks-ui`
# consomme `ks-cli`, qui lit `workstation.yaml` avec `serde-saphyr`. Cet arbre
# entre donc ici, et il fait entrer avec lui les let-chains stabilisées en 1.88.
# Mesuré des deux côtés, comme à la racine : `cargo +1.87.0 check --locked
# --workspace --all-targets --ignore-rust-version` échoue sur ces let-chains,
# `cargo +1.88.0 check --locked --workspace --all-targets` compile.
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Projet Keystone"]
repository = "https://github.com/ten-tech/keystone"

[workspace.dependencies]
# `version` en plus de `path`, comme à la racine : sans elle la dépendance est
# un joker que `cargo deny check bans` refuse.
ks-cli = { path = "../crates/ks-cli", version = "0.1.0" }
ks-collectors = { path = "../crates/ks-collectors", version = "0.1.0" }
# Le vocabulaire du produit — `Item`, `Domain`, `Verdict`. La coque le lit pour
# décider ce qu'elle affiche ; elle n'en redéfinit aucune notion. Déjà dans
# l'arbre par `ks-cli` et `ks-collectors` : nommer ce crate n'ajoute aucune
# surface, il rend seulement visible ce qui était déjà là.
ks-core = { path = "../crates/ks-core", version = "0.1.0" }

chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
# Même politique que le workspace principal : pas de symboles bavards, pas de
# panique silencieuse. `panic = "abort"` en moins — Tauri et son runtime
# s'appuient sur le déroulement de pile pour rapporter la panique d'une commande
# au lieu d'emporter la fenêtre avec elle.
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = 1
