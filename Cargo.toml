[workspace]
# Résolveur 3 — celui qui refuse une version au-dessus de la MSRV.
#
# Le piège s'est refermé trois fois sur ce projet : `libsqlite3-sys` 0.38,
# `wmi` 0.18, `sysinfo` 0.39. À chaque fois le résolveur acceptait la mise à
# jour et l'échec n'arrivait qu'à la compilation, plusieurs minutes plus tard.
# Depuis Rust 1.84 le résolveur sait lire le `rust-version` des candidats ; il
# annonce désormais « Locking N packages to latest Rust 1.85 compatible
# versions » et écarte les autres.
#
# Le réglage par `.cargo/config.toml` (`resolver.incompatible-rust-version`)
# a été essayé d'abord, et **mesuré sans effet** : cargo le déclare « unused
# config key » tant que le manifeste reste en résolveur 2. Il fallait le
# résolveur 3. La compatibilité a été vérifiée en compilant sous cargo 1.85.0,
# pas déduite.
#
# Ce que ça ne couvre pas, et qu'il faut garder en tête : douze dépendances de
# l'arbre ne déclarent aucun `rust-version` — `blake3`, `rusqlite`,
# `libsqlite3-sys`, `wmi` en font partie. Le résolveur ne peut rien comparer,
# donc rien écarter. Le job « MSRV » de la CI reste le seul filet pour
# celles-là.
resolver = "3"
members = [
    "crates/ks-core",
    "crates/ks-cli",
    "crates/ks-collectors",
    "crates/ks-broker",
    "crates/ks-agent-linux",
]

# `ui/` est un workspace SÉPARÉ, et cette ligne l'énonce plutôt que de compter
# sur le hasard : la liste `members` étant explicite, cargo n'y toucherait pas
# aujourd'hui, mais un futur `crates/*` en glob l'y ramènerait sans prévenir.
#
# La raison est mesurée : la coque Tauri tire ~415 crates, contre 123 pour ce
# workspace. Les fusionner ferait payer à chaque `cargo test --workspace` et à
# chaque job de CI la compilation d'un arbre qui ne les concerne pas, et
# imposerait un verrou commun où la moindre mise à jour de `wry` déplacerait les
# versions du noyau. `ui/ks-ui` dépend de `crates/ks-cli` par chemin ; la
# dépendance va donc dans un seul sens, et le verrou de ce workspace-ci ne gagne
# pas une seule entrée.
exclude = ["ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Version minimale mesurée, pas estimée, et **encadrée des deux côtés** :
# `cargo +1.87.0 check --locked --workspace --all-targets` échoue, `cargo +1.88.0`
# compile. La version juste en dessous du plancher échoue : c'est ce qui
# distingue une mesure d'une déduction.
#
# Le plancher vient de `serde-saphyr` 1.0.0 (ADR-0016), qui emploie des
# let-chains, stabilisées en Rust 1.88, et qui ne déclare **aucun**
# `rust-version` — le résolveur 3 n'a donc rien à comparer, donc rien à écarter.
# C'est la cinquième occurrence du piège sur ce projet, après `libsqlite3-sys`,
# `wmi`, `sysinfo` et `tauri` par transitivité.
#
# L'histoire précédente, gardée pour mémoire : la valeur 1.80 déclarée
# initialement n'avait jamais été éprouvée, et `clap_lex` exigeait déjà 1.85 —
# cinq versions d'écart, invisibles sans compiler. Le job « MSRV » de ci.yml est
# le seul filet, et il ne se déclenche qu'après avoir compilé.
#
# Relever ce nombre est une décision : il ferme la porte à des postes plus
# anciens. Elle est assumée par l'ADR-0016 — Keystone est un binaire signé pour
# Windows 11, pas une bibliothèque dont d'autres compileraient les sources avec
# un compilateur ancien.
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Projet Keystone"]
repository = "https://github.com/ten-tech/keystone"

[workspace.dependencies]
# `version` en plus de `path` : sans elle, la dépendance interne est un
# joker (`*`) que `cargo deny check bans` refuse à juste titre — et le crate
# serait impubliable, crates.io rejetant les dépendances par chemin seul.
ks-core = { path = "crates/ks-core", version = "0.1.0" }
ks-collectors = { path = "crates/ks-collectors", version = "0.1.0" }

# BLAKE3 remplace le bouchon FNV-1a du chaînage du journal (ADR-0004).
# `default-features = false` retire rayon et la parallélisation : on hache
# quelques centaines d'octets par entrée, un pool de threads n'y sert à rien
# et ajoute une surface. Version stable vérifiée à la source le 2026-08-02.
blake3 = { version = "1.8", default-features = false }

anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Lecture de `workstation.yaml`, et **rien d'autre** (ADR-0016).
#
# `default-features = false` retire `serialize` : Keystone n'écrit pas son yaml
# avec un sérialiseur serde. Mesuré, celui-ci émet les textes sans guillemets —
# donc un fichier qui se relit correctement par chance — et n'émet aucun
# commentaire, ce qui annulerait la contrepartie promise par l'ADR-0010 à la
# forme plate. L'écriture passera par un émetteur maison, dans un lot ultérieur.
#
# Version épinglée à l'exact : un crate publié il y a trois jours et qui ne
# déclare aucun `rust-version` ne bénéficie pas du bénéfice du doute d'un `^`.
# C'est lui qui porte la MSRV du projet à 1.88 — voir `rust-version` ci-dessus.
#
# La surface consommée est `from_str` vers deux types, et **elle ne doit pas
# grandir** : pas d'ancres, pas d'inclusions, pas de `figment`, pas de `garde`.
# C'est ce qui garde le remplacement du crate à une journée de travail.
serde-saphyr = { version = "=1.0.0", default-features = false, features = [
    "deserialize",
] }
sysinfo = "0.32"
thiserror = "2"

# Volontairement PAS la 0.40, dernière stable. Son `libsqlite3-sys` 0.38 appelle
# `cfg_select!` dans son script de build ; la macro n'est stabilisée qu'en Rust
# 1.95, cinq versions au-dessus de notre MSRV. Ni l'un ni l'autre ne déclare de
# `rust-version`, donc le résolveur ne refuse rien : l'échec n'arrive qu'à la
# compilation. Vérifié en compilant, pas en lisant. À revoir le jour où la MSRV
# du projet dépassera 1.95.
#
# `default-features = false` retire le cache de requêtes préparées : trois
# requêtes jetables par scan n'en tirent aucun bénéfice, et il coûte trois
# crates de plus.
# Volontairement PAS la 0.18+. Elle passe en `edition = "2024"` et emploie des
# let-chains, stabilisees en Rust 1.88 — trois versions au-dessus de notre MSRV
# 1.85. Ni le manifeste ni le resolveur ne le signalent : l'echec n'arrive qu'a
# la compilation. Deuxieme occurrence de ce piege sur ce projet, apres
# libsqlite3-sys et sa macro cfg_select!. Verifie en compilant, le 2026-08-02.
wmi = "0.17.3"

rusqlite = { version = "0.39", default-features = false, features = ["bundled"] }

# Le profil de release est volontairement strict : le broker est un composant
# privilégié, on ne veut ni symboles bavards ni panique silencieuse.
[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
# Le cycle de dev passe par une VM : on privilégie la vitesse d'itération.
opt-level = 0
debug = 1
