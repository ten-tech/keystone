[workspace]
# Résolveur 3 — celui qui refuse une version au-dessus de la MSRV.
#
# Le piège s'est refermé trois fois sur ce projet : `libsqlite3-sys` 0.38,
# `wmi` 0.18, `sysinfo` 0.39. À chaque fois le résolveur acceptait la mise à
# jour et l'échec n'arrivait qu'à la compilation, plusieurs minutes plus tard.
# Depuis Rust 1.84 le résolveur sait lire le `rust-version` des candidats ; il
# annonce désormais « Locking N packages to latest Rust 1.85 compatible
# versions » et écarte les autres.
#
# Le réglage par `.cargo/config.toml` (`resolver.incompatible-rust-version`)
# a été essayé d'abord, et **mesuré sans effet** : cargo le déclare « unused
# config key » tant que le manifeste reste en résolveur 2. Il fallait le
# résolveur 3. La compatibilité a été vérifiée en compilant sous cargo 1.85.0,
# pas déduite.
#
# Ce que ça ne couvre pas, et qu'il faut garder en tête : douze dépendances de
# l'arbre ne déclarent aucun `rust-version` — `blake3`, `rusqlite`,
# `libsqlite3-sys`, `wmi` en font partie. Le résolveur ne peut rien comparer,
# donc rien écarter. Le job « MSRV » de la CI reste le seul filet pour
# celles-là.
resolver = "3"
members = [
    "crates/ks-core",
    "crates/ks-cli",
    "crates/ks-collectors",
    "crates/ks-broker",
    "crates/ks-agent-linux",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Version minimale mesurée, pas estimée : `cargo +1.80 check` échoue, parce que
# `clap_lex` exige la fonctionnalité `edition2024`, stabilisée en Rust 1.85.
# La valeur 1.80 déclarée initialement n'avait jamais été éprouvée — aucun job
# de CI ne la vérifiait. Il en existe un maintenant (« MSRV » dans ci.yml).
# Relever ce nombre est une décision : il ferme la porte à des postes plus anciens.
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Projet Keystone"]
repository = "https://github.com/ten-tech/keystone"

[workspace.dependencies]
# `version` en plus de `path` : sans elle, la dépendance interne est un
# joker (`*`) que `cargo deny check bans` refuse à juste titre — et le crate
# serait impubliable, crates.io rejetant les dépendances par chemin seul.
ks-core = { path = "crates/ks-core", version = "0.1.0" }
ks-collectors = { path = "crates/ks-collectors", version = "0.1.0" }

# BLAKE3 remplace le bouchon FNV-1a du chaînage du journal (ADR-0004).
# `default-features = false` retire rayon et la parallélisation : on hache
# quelques centaines d'octets par entrée, un pool de threads n'y sert à rien
# et ajoute une surface. Version stable vérifiée à la source le 2026-08-02.
blake3 = { version = "1.8", default-features = false }

anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
thiserror = "2"

# Volontairement PAS la 0.40, dernière stable. Son `libsqlite3-sys` 0.38 appelle
# `cfg_select!` dans son script de build ; la macro n'est stabilisée qu'en Rust
# 1.95, cinq versions au-dessus de notre MSRV. Ni l'un ni l'autre ne déclare de
# `rust-version`, donc le résolveur ne refuse rien : l'échec n'arrive qu'à la
# compilation. Vérifié en compilant, pas en lisant. À revoir le jour où la MSRV
# du projet dépassera 1.95.
#
# `default-features = false` retire le cache de requêtes préparées : trois
# requêtes jetables par scan n'en tirent aucun bénéfice, et il coûte trois
# crates de plus.
# Volontairement PAS la 0.18+. Elle passe en `edition = "2024"` et emploie des
# let-chains, stabilisees en Rust 1.88 — trois versions au-dessus de notre MSRV
# 1.85. Ni le manifeste ni le resolveur ne le signalent : l'echec n'arrive qu'a
# la compilation. Deuxieme occurrence de ce piege sur ce projet, apres
# libsqlite3-sys et sa macro cfg_select!. Verifie en compilant, le 2026-08-02.
wmi = "0.17.3"

rusqlite = { version = "0.39", default-features = false, features = ["bundled"] }

# Le profil de release est volontairement strict : le broker est un composant
# privilégié, on ne veut ni symboles bavards ni panique silencieuse.
[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
# Le cycle de dev passe par une VM : on privilégie la vitesse d'itération.
opt-level = 0
debug = 1
