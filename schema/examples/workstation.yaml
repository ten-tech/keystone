# ═══════════════════════════════════════════════════════════════════════════
#  EXEMPLE de workstation.yaml — machine FICTIVE
#
#  Ce fichier est versionné dans le dépôt de l'outil à titre d'exemple.
#  TON fichier réel vit dans TON dépôt, séparé et privé : il contient les noms
#  de tes machines, tes chemins, tes exceptions, la topologie de ton réseau.
#  C'est de la reconnaissance offerte à qui le lirait.
#  → voir docs/08-CONVENTIONS.md § « Les deux dépôts »
#
#  Il est validé DEUX FOIS par l'intégration continue, et les deux disent des
#  choses différentes (ADR-0010, décision n° 4) :
#
#    · contre ../workstation.schema.json, qui est GÉNÉRÉ depuis les types de
#      `ks-cli` et décrit la forme du document ;
#    · par `EtatDesire::lire`, c'est-à-dire par le produit lui-même, qui refuse
#      en plus une clé écrite deux fois et un en-tête qu'il ne sait pas relire.
#
#  Un exemple validé par le seul validateur externe peut très bien être refusé
#  par Keystone. C'est arrivé : ce fichier a porté pendant toute la Phase 0 une
#  forme imbriquée que plus aucun code ne lisait.
#
#  La forme la plus simple de l'obtenir pour ta machine :  ks import
# ═══════════════════════════════════════════════════════════════════════════

apiVersion: keystone/v1
kind: Workstation

metadata:
  name: WKS-EXEMPLE-01
  inherits: "./base.yaml"        # surcouche de flotte (D2-10, D13-01)
  owner: exemple
  description: "Poste d'ingénieur, Windows 11 avec WSL2 et Hyper-V."

# ─── Ce qui est voulu, un chemin d'item par ligne ──────────────────────────
#
# La table est PLATE et indexée par le chemin que `ks scan` affiche (ADR-0010,
# décision n° 1). L'espace des chemins produit par les collecteurs est la source
# de vérité : le fichier le référence, le schéma en dérive.
#
# Les textes portent des guillemets pour se relire tels qu'ils ont été écrits.
# Sans eux, YAML lit « off », « no », « on » et « 0x9 » comme un booléen ou un
# nombre AVANT que Keystone les voie, et l'écart qui en naît est permanent sur
# une machine qui n'a jamais changé. Keystone refuse alors la déclaration en
# nommant la ligne — mais il vaut mieux ne pas l'écrire.
desired:
  # Posture de sécurité
  security.defender.behavior_monitoring: true
  security.defender.realtime: true
  security.defender.tamper_protection: true

  # Une liste reste une liste ; vide, elle se déclare `[]`.
  security.defender.asr_rules.local:
    - "BlockOfficeChildProcess"
    - "BlockCredentialStealing"

  security.firewall.domain.enabled: true
  security.firewall.private.enabled: true
  security.firewall.public.enabled: true

  # Les jetons sont des textes, et ceux-ci viennent de l'ADR-0015 : ils ne se
  # traduisent pas d'un poste à l'autre, ils se recopient tels quels.
  security.platform.code_integrity_enforcement: "imposee"
  security.platform.hvci_policy: true
  security.platform.hvci_running: "en-execution"
  security.platform.lsa_protection: "active"
  security.platform.lsa_protection_uefi_lock: false
  security.platform.secure_boot: true
  security.platform.vbs_running: "en-execution"

  security.services.eventlog.startup: "automatique"
  security.services.mpssvc.startup: "automatique"
  security.services.windefend.startup: "automatique"

  # « Cet item ne doit pas exister » s'écrit en objet, et jamais `~` ni `null` :
  # ceux-là se confondraient avec « je ne contrains pas cet item », qui est
  # l'intention exactement opposée (ADR-0016, décision n° 4).
  security.services.sense.startup: { absent: true }

  # Virtualisation
  virtualization.wsl[ubuntu-dev].drive_mounting: true
  virtualization.wsl[ubuntu-dev].interop: true

# ─── Écarts acceptés ───────────────────────────────────────────────────────
# Raison ET expiration obligatoires (D2-06), et c'est le typage qui le tient :
# aucun des deux champs n'est optionnel. À l'échéance, l'écart redevient actif
# tout seul — aucune exception permanente silencieuse.
acceptedDrift:
  - item: security.services.fax.startup
    reason: "requis temporairement par le pilote du scanner du labo"
    # Les dates sont citées, et pas par superstition : sans guillemets, YAML en
    # fait un objet date, que le validateur JSON Schema refuse là où il attend
    # une chaîne. Keystone, lui, relit les deux — d'où l'intérêt d'avoir les
    # deux validations plutôt qu'une.
    #
    # L'échéance est INCLUSE : la tolérance vaut encore tout le 15 octobre, et
    # cesse le 16. C'est la lecture qu'attend quiconque écrit cette ligne, et
    # l'autre convention retirerait une journée sans le dire.
    expires: "2026-10-15"
    decidedBy: exemple
    decidedAt: "2026-07-18T09:12:00+02:00"
