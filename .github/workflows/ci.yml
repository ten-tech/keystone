name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Le jeton par défaut ne sert qu'à lire le dépôt. Chaque job qui a besoin de
# plus le déclare lui-même. Cohérence avec l'adversaire A4 du modèle de menace :
# un workflow trop permissif est une surface de chaîne d'approvisionnement.
permissions:
  contents: read

# Un push qui en remplace un autre annule le run devenu inutile.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # PAS de `RUSTFLAGS: "-D warnings"` ici, et c'est délibéré.
  #
  # Cargo transmet RUSTFLAGS à TOUTES les crates, dépendances comprises : un
  # simple `deprecated` chez un tiers ferait tomber toute la CI. Surtout, un
  # `-D warnings` global transforme en erreur le `unsafe_code = "warn"` que
  # docs/08-CONVENTIONS.md pose volontairement sur ks-collectors et ks-broker.
  # La Phase 0.2 (TPM, Secure Boot, BitLocker) est entièrement faite d'appels
  # `unsafe` au crate `windows` : la CI deviendrait rouge au premier bloc, et
  # la voie de moindre résistance serait un `#![allow(unsafe_code)]` global —
  # soit la neutralisation exacte du garde-fou.
  #
  # `-D warnings` reste appliqué à clippy, explicitement, sur NOTRE code seul.

# ─── Runners épinglés, et la dette que ça crée ──────────────────────────────
#
# `ubuntu-24.04` et `windows-2025` plutôt que `-latest`, pour la même raison que
# `Cargo.lock` et les SHA d'actions : un build reproductible ne dépend pas d'une
# étiquette qui bascule sans qu'aucun commit n'ait bougé. `devops.md` pose la
# règle — jamais `latest`.
#
# **Ce que ça coûte, et qu'il faut savoir.** Une image épinglée finit par être
# retirée : GitHub annonce la dépréciation puis programme des coupures avant la
# suppression. Et Dependabot ne suit PAS les étiquettes de runner — il ne couvre
# que les actions et les crates. Cette ligne-ci ne se met donc à jour que
# manuellement.
#
# À vérifier à chaque revue de dépendances, à la source :
#   https://github.com/actions/runner-images
#
# Au 2026-08-02 : `ubuntu-latest` désignait 24.04, `windows-latest` désignait
# Windows Server 2025. Épingler revient donc à figer l'état du jour, pas à
# rétrograder.

# ─── Toolchain Rust ─────────────────────────────────────────────────────────
#
# Aucun job ne déclare `targets:` ni `components:` : `rust-toolchain.toml` les
# gouverne et l'emporte de toute façon sur ce qu'installe l'action. Les déclarer
# aux deux endroits, c'était deux vérités pour une seule question — et la seconde
# ne servait à rien. Une déclaration, zéro dérive.
#
# **La révision de l'action doit rester alignée sur `rust-toolchain.toml`.**
# Vérifié à la source : cette action ne lit PAS `rust-toolchain.toml`. Avec une
# révision `@stable` et un fichier épinglé sur une version exacte, chaque job
# téléchargerait donc DEUX toolchains — celle de l'action, puis celle que rustup
# installe à la première invocation de cargo. Et `Swatinem/rust-cache` ne met pas
# `~/.rustup` en cache : le surcoût serait payé à chaque run, sur huit jobs.
#
# D'où la révision `1.97.1`, identique au fichier. C'est le seul endroit du dépôt
# où une version est écrite deux fois ; les deux se déplacent ensemble, ou pas
# du tout.
#
# Seul le job `msrv` s'en écarte, volontairement, via `cargo +1.88.0`.

jobs:
  # ── Le socle portable ──────────────────────────────────────────────────
  # ks-core, ks-collectors, ks-cli et ks-agent-linux compilent partout : c'est
  # ce qui rend cette étape rapide et exécutable sur un agent Linux. Elle garde
  # `main` vert sur l'essentiel sans attendre un agent Windows.
  portable:
    name: Socle portable (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # branche 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format
        run: cargo fmt --all --check

      # `--locked` : Cargo.lock est versionné, et la CI doit échouer s'il n'est
      # plus à jour plutôt que de le réécrire en silence. Sur un projet qui
      # livre un composant privilégié, une dépendance résolue à la volée est
      # une dépendance non tracée.
      - name: Clippy — aucun avertissement toléré
        run: cargo clippy --locked -p ks-core -p ks-collectors -p ks-cli -p ks-agent-linux --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked -p ks-core -p ks-collectors -p ks-cli -p ks-agent-linux

      - name: La CLI répond
        run: |
          cargo run --locked -q -p ks-cli -- status
          cargo run --locked -q -p ks-cli -- scan --json > /dev/null

  # ── La cible réelle du produit ─────────────────────────────────────────
  windows:
    name: Cible du produit (Windows, MSVC)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # branche 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Clippy sur tout le workspace, broker compris
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

      # Le nombre de tests annoncé par la documentation doit être le vrai.
      #
      # Ce n'est pas du zèle : la valeur a déjà dérivé deux fois — 34 annoncés
      # pour 107 réels, puis 100 pour 110 — et elle apparaît dans plusieurs
      # documents à la fois. Un chiffre écrit à la main, cité à cinq endroits et
      # vérifié nulle part, est un mensonge à échéance connue.
      #
      # La friction est assumée : ajouter un test oblige à toucher la
      # documentation dans le même commit, ce que les conventions du projet
      # exigent déjà. Le contrôle ne réécrit rien, il refuse.
      - name: Le nombre de tests annoncé est le vrai
        shell: bash
        run: |
          # `awk` plutôt que `paste | bc` : `bc` n'est pas présent dans le bash
          # fourni avec Git sous Windows, et c'est ce bash qui exécute cette
          # étape. Mesuré, pas supposé.
          mesure=$(cargo test --locked --workspace 2>&1 \
            | grep -oE 'test result: ok\. [0-9]+ passed' \
            | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "Mesuré : $mesure tests."
          # Une formulation unique porte le total : « N tests au total ». Les
          # décomptes par crate emploient délibérément une autre tournure, pour
          # que ce contrôle ne les confonde pas avec le total.
          ecarts=0
          vus=0
          for f in $(git ls-files 'docs/*.md' 'README.md'); do
            for annonce in $(grep -oE '[0-9]+ tests au total' "$f" | grep -oE '^[0-9]+'); do
              vus=$((vus + 1))
              if [ "$annonce" != "$mesure" ]; then
                echo "::error file=$f::annonce $annonce tests au total, la suite en compte $mesure"
                ecarts=1
              fi
            done
          done
          if [ "$vus" -eq 0 ]; then
            echo "::error::aucune annonce « N tests au total » trouvée — le contrôle ne contrôle plus rien"
            ecarts=1
          fi

          # Les décomptes PAR CRATE du tableau de docs/03-ARCHITECTURE.md.
          #
          # Le contrôle ci-dessus ne regardait que le total, jamais le détail.
          # La ligne `ks-cli` a donc pu dériver sur trois commits, au point que
          # le tableau se contredisait lui-même : la somme de ses propres
          # chiffres donnait 126 quand il en annonçait 128.
          #
          # On ne mesure PAS chaque crate séparément — cinq `cargo test -p` de
          # plus pour un gain nul. On exige que la somme des lignes égale le
          # total, lequel est déjà mesuré face à cargo juste au-dessus. Les
          # lignes deviennent donc justes par transitivité, et le contrôle
          # reste une seule soustraction.
          #
          # `ks-ui` est exclu : il vit dans un workspace séparé (ADR-0012) et
          # ses tests ne figurent pas dans ce total. La liste des membres est
          # lue dans Cargo.toml, jamais recopiée.
          membres=$(grep -oE '"crates/[a-z-]+"' Cargo.toml | sed -E 's|"crates/||; s|"||' | sort -u)
          somme=0
          lignes=0
          while IFS= read -r ligne; do
            crate=$(echo "$ligne" | grep -oE '`ks-[a-z-]+`' | head -1 | tr -d '`')
            echo "$membres" | grep -qx "$crate" || continue
            lignes=$((lignes + 1))
            for n in $(echo "$ligne" | grep -oE "[0-9]+ (tests?|d'intégration)" | grep -oE '^[0-9]+'); do
              somme=$((somme + n))
            done
          done <<< "$(grep '^| `ks-' docs/03-ARCHITECTURE.md)"

          if [ "$lignes" -eq 0 ]; then
            echo "::error::aucune ligne de crate lue dans le tableau — le contrôle ne contrôle plus rien"
            ecarts=1
          elif [ "$somme" != "$mesure" ]; then
            echo "::error file=docs/03-ARCHITECTURE.md::les décomptes par crate totalisent $somme, la suite en compte $mesure"
            ecarts=1
          else
            echo "✓ $lignes lignes de crate, somme $somme = total mesuré"
          fi

          exit $ecarts

      # Cette étape n'est pas décorative : elle isole les BARRIÈRES DE CONCEPTION
      # du broker (SEC-02 et SEC-03, critère A11) pour qu'un échec se lise d'un
      # coup d'œil, sans fouiller la sortie de tout le workspace.
      #
      # Elles sont **huit**, et elles ne se comptent pas au doigt mouillé : une
      # revue adverse a produit dix-neuf tentatives de contournement, dont douze
      # qu'elle a trouvées seule (voir docs/adr/0007). Chaque barrière ferme une
      # famille — délimitation, ancre, extraction, projection.
      #
      # L'étape ne citait qu'un seul de ces tests pendant toute la Phase 0, ce
      # qui est très exactement le défaut que ces barrières traquent : un
      # garde-fou qui garde moins que ce qu'il annonce.
      - name: Barrières SEC-02 et SEC-03 — l'API du broker reste fermée
        shell: bash
        run: |
          # Le chemin de module `tests::` est obligatoire avec `--exact`. Sans lui,
          # le filtre n'appariait AUCUN test : l'étape sortait en succès avec
          # « 0 passed; 2 filtered out ». Un garde-fou vert qui ne s'exécute pas
          # est pire qu'une absence de garde-fou — on lui fait confiance.
          barrieres=(
            aucun_verbe_ne_transporte_dexecution_arbitraire
            lenumeration_des_verbes_est_lisible_telle_quelle
            la_lecture_textuelle_voit_tous_les_verbes
            le_source_lu_porte_les_champs_du_type_compile
            aucune_variante_nenveloppe_sa_charge_utile
            tout_parametre_de_verbe_designe_un_ensemble_fini
            aucun_attribut_serde_ne_regle_la_projection
            une_exclusion_defender_exige_raison_et_expiration
          )
          echec=0
          for barriere in "${barrieres[@]}"; do
            # `|| true` : `shell: bash` implique `set -e`, donc un échec de cargo
            # interromprait la boucle AVANT le `echo`. Le jour où une barrière
            # casse — le seul jour où cette étape sert — le contributeur verrait
            # une étape rouge sans le message d'assertion qui lui dit quoi lire.
            sortie=$(cargo test --locked -p ks-broker \
              "tests::$barriere" -- --exact --nocapture 2>&1) || true
            echo "$sortie"
            # Et on vérifie que la barrière a bel et bien TOURNÉ : c'est ce
            # contrôle qui empêche de retomber dans le succès à vide, celui
            # qu'un nom de test mal orthographié produirait.
            if ! echo "$sortie" | grep -q "^test result: ok\. 1 passed"; then
              echo "::error::barrière « $barriere » : non exécutée, ou en échec"
              echec=1
            fi
          done
          exit "$echec"

  # ── L'agent Linux, tel qu'il est livré ─────────────────────────────────
  agent-musl:
    name: Agent Linux (musl statique)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # branche 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Compilation
        run: cargo build --locked -p ks-agent-linux --release --target x86_64-unknown-linux-musl

      - name: Vérifier que le binaire est bien statique
        run: |
          f=target/x86_64-unknown-linux-musl/release/ks-agent
          file "$f"
          readelf -l "$f" | grep -E "INTERP|Requesting" || true
          # Un agent lié dynamiquement échouerait sur une distro à glibc trop
          # ancienne — et on ne le découvrirait que chez l'utilisateur.
          #
          # Le critère est l'ABSENCE de segment PT_INTERP, pas la sortie de
          # `ldd` : la cible musl de Rust produit aujourd'hui un static-PIE
          # (ELF de type DYN), pour lequel `ldd` affiche « statically linked »
          # et non « not a dynamic executable ». Tester la chaîne rejetterait
          # donc un binaire parfaitement statique.
          if readelf -l "$f" | grep -q "INTERP"; then
            echo "::error::le binaire n'est pas statique (segment PT_INTERP présent)"
            exit 1
          fi
          echo "✓ aucun interpréteur de programme : binaire autonome"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ks-agent-musl
          path: target/x86_64-unknown-linux-musl/release/ks-agent

  # ── Le schéma et son exemple ───────────────────────────────────────────
  #
  # Le schéma a été écrit à la main pendant toute la Phase 0 — 380 lignes, une
  # forme imbriquée que plus aucun code ne lisait depuis l'ADR-0010. Il était
  # cohérent avec son exemple, et avec rien d'autre. Il est désormais GÉNÉRÉ
  # depuis les types de `ks-cli` (ADR-0010, décision n° 2).
  #
  # **Un schéma généré qu'on ne régénère pas en intégration continue redevient
  # un document écrit à la main au premier oubli.** D'où le premier travail
  # ci-dessous, et d'où sa forme : on régénère, puis on refuse tout écart.
  schema:
    name: Schéma workstation.yaml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # branche 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # `rfc3339-validator` n'est pas cosmétique : en Draft 2020-12, `format`
      # est une simple annotation, et `jsonschema` ne vérifie `date-time` que si
      # ce paquet est présent. Sans lui, `decidedAt` du bloc acceptedDrift
      # passait sans contrôle alors que le job prétendait le valider.
      - run: pip install jsonschema pyyaml rfc3339-validator

      # `git diff --exit-code` et non une comparaison de chaînes : il voit aussi
      # les fins de ligne, que `.gitattributes` fixe à LF. Le contrôle ne
      # réécrit rien dans le dépôt — il refuse, et affiche ce qui diffère.
      - name: Le schéma est généré, pas écrit
        run: |
          cargo run --locked -q -p ks-cli --example generer-schema \
            > schema/workstation.schema.json
          if ! git diff --exit-code -- schema/workstation.schema.json; then
            echo "::error file=schema/workstation.schema.json::le schéma commité ne correspond pas aux types de ks-cli. Régénérez-le : cargo run -q -p ks-cli --example generer-schema > schema/workstation.schema.json"
            exit 1
          fi
          echo "✓ le schéma commité est celui que les types produisent"

      # Attrape notamment les pièges de typage implicite de YAML 1.1 :
      # `expires: 2026-09-01` devient une date, `boost: off` devient false.
      - name: Le schéma est valide et l'exemple s'y conforme
        run: |
          python - <<'EOF'
          import json, sys, yaml
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.load(open('schema/workstation.schema.json'))
          Draft202012Validator.check_schema(schema)
          v = Draft202012Validator(schema, format_checker=FormatChecker())
          doc = yaml.safe_load(open('schema/examples/workstation.yaml'))
          errs = sorted(v.iter_errors(doc), key=lambda e: list(e.path))
          for e in errs:
              print('::error::' + '/'.join(map(str, e.path)) + ' → ' + e.message)
          sys.exit(1 if errs else 0)
          EOF

      # La boucle complète, et c'est la vérification qui a le plus de valeur :
      # le produit écrit, le schéma accepte, le produit relit. Chacune des trois
      # peut passer sans les deux autres — un exemple validé par le seul
      # validateur externe peut très bien être refusé par Keystone, et c'est
      # exactement l'état dont ce lot sort.
      #
      # Ce que cette étape voit ICI, et qu'il faut savoir : sur un agent Linux
      # aucun item n'est déclarable, donc `ks import` y dépose `desired: {}`.
      # Elle éprouve la forme du document, pas la richesse de son contenu. Le
      # contenu, lui, est éprouvé sur la machine de référence par les tests de
      # `emetteur.rs`, et le travail « Cible du produit » les exécute sur
      # Windows.
      - name: La boucle complète — ks import, puis le schéma, puis ks diff
        run: |
          cargo run --locked -q -p ks-cli -- import --out importe.yaml --force
          python - <<'EOF'
          import json, sys, yaml
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.load(open('schema/workstation.schema.json'))
          v = Draft202012Validator(schema, format_checker=FormatChecker())
          doc = yaml.safe_load(open('importe.yaml'))
          errs = sorted(v.iter_errors(doc), key=lambda e: list(e.path))
          for e in errs:
              print('::error::ks import a écrit un fichier que le schéma refuse : '
                    + '/'.join(map(str, e.path)) + ' → ' + e.message)
          sys.exit(1 if errs else 0)
          EOF
          # Et Keystone relit ce qu'il vient d'écrire. `ks diff` charge le
          # fichier par `EtatDesire::lire` : un document que le lecteur refuse
          # fait sortir la commande en erreur.
          cargo run --locked -q -p ks-cli -- --config importe.yaml diff > /dev/null
          rm -f importe.yaml
          echo "✓ écrit par le produit, accepté par le schéma, relu par le produit"

  # ── La version minimale annoncée est-elle vraie ? ──────────────────────
  # `rust-version` dans Cargo.toml est une promesse faite aux contributeurs.
  # Sans ce job, elle n'est vérifiée par personne : la valeur initiale (1.80)
  # était fausse de cinq versions, et n'a été découverte qu'en compilant.
  #
  # `cargo +VERSION` est nécessaire : rust-toolchain.toml épingle « stable » et
  # l'emporterait autrement sur la toolchain installée par l'action.
  #
  # **La matrice n'est pas du confort.** Ce job ne tournait que sur Linux, et ne
  # compilait donc jamais une seule ligne de `#[cfg(windows)]` — c'est-à-dire
  # l'essentiel des deux collecteurs, et la totalité des crates Windows. La MSRV
  # était vérifiée partout sauf sur la plateforme qu'on livre. Un cas réel l'a
  # montré : le script de build de `libsqlite3-sys` 0.38 appelle `cfg_select!`,
  # stabilisée en Rust 1.95 ; la régression n'aurait été visible ni ici, ni chez
  # quiconque compile avec la toolchain épinglée.
  msrv:
    name: Version minimale (MSRV, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # branche 1.88.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Le workspace compile sur la MSRV déclarée
        run: cargo +1.88.0 check --locked --workspace --all-targets

      # La coque de bureau déclare la même MSRV, et il faut la mesurer pour la
      # même raison. Elle en est même le cas le plus tendu : `tauri` annonce
      # 1.77.2 alors que son arbre transitif exige 1.88 sans le résolveur 3
      # (`darling_macro` 1.88, `icu_collections` 1.86). C'est la quatrième
      # occurrence de ce piège sur ce projet ; celle-ci n'a pas mordu, et ce
      # job est ce qui garantit qu'elle ne mordra pas demain non plus.
      #
      # Le relèvement à 1.88 (ADR-0016) l'a rendue OBLIGATOIRE ici, et pas par
      # symétrie : `ks-ui` consomme `ks-cli` par chemin, donc l'arbre de
      # `serde-saphyr` entre dans son verrou — sept entrées de plus, de 465 à
      # 472 — alors que la coque ne lit aucun yaml. Elle ne peut donc plus
      # compiler à 1.85. Mesuré des deux côtés : `cargo +1.87.0 check
      # --ignore-rust-version` échoue sur les let-chains de `serde-saphyr`,
      # `cargo +1.88.0 check` compile en 2 min 47.
      #
      # Windows seulement : `tauri` ne compile pas sans WebView2.
      - name: La coque de bureau compile sur la MSRV déclarée
        if: runner.os == 'Windows'
        working-directory: ui
        run: cargo +1.88.0 check --locked --workspace --all-targets

  # ── Chaîne d'approvisionnement ─────────────────────────────────────────
  # Sur un composant privilégié, chaque crate ajoutée est une surface ajoutée
  # (voir docs/04-MODELE-DE-MENACE.md, adversaire A4).
  audit:
    name: Audit des dépendances
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # L'action publie son résultat sous forme de « check run ». Elle n'ouvre
      # d'issue que sur déclenchement `schedule`, que ce workflow n'a pas —
      # `issues: write` serait donc une permission accordée pour rien.
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── Licences, doublons, provenance ─────────────────────────────────────
  # docs/08-CONVENTIONS.md § « Dépendances » prescrit `cargo deny check`.
  # L'outil était demandé au développeur par scripts/dev-setup.ps1 sans qu'aucune
  # configuration ne l'accompagne : il ne servait à rien. La configuration est
  # maintenant dans deny.toml, à la racine.
  deny:
    name: Licences et provenance des dépendances
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

      # `ui/` est un workspace séparé (ADR-0012), donc un verrou séparé, donc
      # invisible de la vérification ci-dessus. Sans cette étape, les ~465
      # crates de l'arbre Tauri — plus de trois fois la surface du produit —
      # ne passaient AUCUN contrôle. Ce n'est pas théorique : la première
      # exécution a remonté trois vulnérabilités et cinq crates abandonnées,
      # toutes transitives, aucune corrigeable depuis ce dépôt. Elles sont
      # écartées une par une, datées et motivées, dans ui/deny.toml.
      #
      # Une politique qui ne couvre qu'un tiers de ce qu'on livre donne une
      # assurance fausse — pire que pas de politique.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features
          manifest-path: ui/Cargo.toml

  # ── La coque de bureau (ADR-0012) ──────────────────────────────────────
  #
  # Workspace séparé : il ne profite d'aucun des travaux ci-dessus, et doit
  # donc porter les siens. Windows seulement — la coque ne se livre que là,
  # et `tauri` ne compile pas sans WebView2.
  ui:
    name: Coque de bureau (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # branche 1.97.1
        with:
          components: rustfmt, clippy

      - name: Format
        working-directory: ui
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: ui
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        working-directory: ui
        run: cargo test --locked --workspace

      # La coque n'affiche JAMAIS la maquette : c'est la décision centrale de
      # l'ADR-0012, et un test la tient. Cette étape l'isole pour qu'un échec
      # se lise sans fouiller la sortie du workspace.
      - name: La coque n'affiche pas la maquette
        working-directory: ui
        run: cargo test --locked --workspace -- --nocapture maquette

  # ── Cohérence de la documentation ──────────────────────────────────────
  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # « Un comportement non documenté est un défaut » : tout document cité
      # doit exister.
      #
      # Cette étape portait une liste écrite à la main. Elle a dérivé deux fois
      # — arrêtée à l'ADR-0003 quand il y en avait sept, puis à l'ADR-0007 quand
      # il y en avait onze — et par construction elle ne pouvait que dériver :
      # une liste de fichiers ne se met à jour que si quelqu'un y pense.
      #
      # On vérifie donc les **liens réels** plutôt qu'un inventaire. C'est
      # strictement plus fort : ça couvre tout fichier cité où que ce soit, ça
      # attrape le lien vers un document supprimé — le cas que la liste ne
      # voyait pas du tout — et ça ne demande aucune maintenance. Le contrôle a
      # été éprouvé par falsification : un lien vers un ADR inexistant ajouté à
      # l'index le fait échouer, son retrait le fait passer.
      #
      # Le lien est résolu depuis le dossier du fichier qui le porte, comme le
      # fait GitHub. Les URL absolues et les ancres pures sont hors sujet.
      - name: Aucun lien mort entre les documents
        run: |
          morts=$(mktemp)
          for source in $(git ls-files '*.md'); do
            base=$(dirname "$source")
            grep -oE '\]\([^)#][^)]*\)' "$source" \
              | sed -E 's/^\]\(//; s/\)$//' \
              | while IFS= read -r cible; do
                  case "$cible" in http*|mailto:*|'') continue ;; esac
                  cible=${cible%%#*}
                  [ -z "$cible" ] && continue
                  if [ ! -e "$base/$cible" ]; then
                    echo "::error file=$source::lien mort vers « $cible »"
                    echo x >> "$morts"
                  fi
                done
          done
          [ ! -s "$morts" ]

      # Garde-fou de vocabulaire. Le glossaire proscrit ces formulations : elles
      # relèvent du dark pattern de la peur ou du charlatanisme (principe P9).
      #
      # Le second filtre écarte les lignes qui CITENT une formulation pour la
      # condamner — la documentation en contient beaucoup, et c'est sain.
      - name: Vocabulaire proscrit
        run: |
          # « détecte( \S+){0,2} intrusions? » et non « détecte (toute|toutes) les? intrusion » :
          # l'ancien motif exigeait la séquence impossible « détecte toute LES intrusion »
          # et ratait donc les deux formulations réelles — dont « Keystone détecte les
          # intrusions », que docs/09-GLOSSAIRE.md désigne pourtant comme LA phrase
          # à proscrire. Un garde-fou qui ne peut pas attraper son propre cas canonique
          # est une étape verte de plus. Vérifié empiriquement sur les cinq tournures.
          hits=$(grep -rniE "détecte( \S+){0,2} intrusions?|optimise votre (PC|système|machine)|accélérateur de (RAM|mémoire)|nettoyeur de registre|\bnettoie\b" \
                   docs/ README.md 2>/dev/null \
                 | grep -viE "aucun|pas de|jamais|proscri|interdit|faux ami|refus|mensonge|dangereux" || true)
          # « » a été RETIRÉ de ce filtre inverse : les guillemets français sont la
          # typographie imposée du projet, donc n'importe quelle phrase en contenant
          # échappait au contrôle. Le garde-fou était désarmé par le style dans lequel
          # la documentation est écrite. Les citations légitimes restent écartées par
          # les mots qui les entourent (« faux ami », « dangereux », « jamais »…).
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::formulation proscrite — voir docs/09-GLOSSAIRE.md § Faux amis"
            exit 1
          fi
          echo "✓ aucune formulation proscrite employée à son compte"

      # Principe P5, « Local, point final » : aucune ressource réseau dans une
      # maquette ni dans un rapport. Ni CDN, ni Google Fonts, ni police distante.
      #
      # Cette règle était écrite depuis le premier commit, et **rien ne la
      # vérifiait** : les deux maquettes ont chargé trois familles Google Fonts
      # pendant toute la Phase 0. Une maquette d'outil de sécurité dont la thèse
      # est qu'il ne parle à personne, et qui annonce à un tiers qu'on l'ouvre :
      # c'est la contradiction la plus visible qu'on pouvait laisser.
      #
      # Le filtre n'écarte que `http://www.w3.org/…`, qui est un espace de noms
      # XML — une chaîne d'identification qu'aucun navigateur ne va chercher.
      #
      # Il écartait aussi un dossier d'import, dont le script téléchargeait React
      # et Babel depuis un CDN. Une exception dans un garde-fou est une exception
      # qui reste : le dossier a été supprimé, sa substance de conception extraite
      # dans `design/ecrans-et-libelles.md`, et l'exception avec lui.
      - name: Aucune ressource réseau dans les maquettes
        run: |
          hits=$(grep -rnoE "https?://[^\"')[:space:]]+" design/ crates/ks-cli/src/rapport.rs 2>/dev/null \
                 | grep -v "www\.w3\.org" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::ressource réseau dans une maquette ou un rapport — principe P5"
            exit 1
          fi
          echo "✓ aucune ressource réseau : les maquettes et le rapport s'ouvrent hors ligne"

      # La maquette redéclare son propre bloc `:root` en recopiant les hex de
      # design/tokens.css, sans `<link>` : c'est ce qui la garde autonome, mais
      # ça crée deux sources de vérité pour la même couleur. Le défaut s'est
      # produit : `--grave` corrigé d'un côté serait resté faux de l'autre.
      #
      # On ne supprime pas la duplication — un fichier qu'on peut envoyer tel
      # quel a de la valeur — on la vérifie. Toute variable définie des deux
      # côtés doit porter la même valeur.
      #
      # Les piles de polices sont comparées au même titre que les couleurs.
      # La première version de ce contrôle ne regardait que les hexadécimaux,
      # et n'a donc pas vu que la maquette nommait ses polices `--sans`,
      # `--tight`, `--mono` quand tokens.css les nommait `--font-sans`,
      # `--font-tight`, `--font-mono` : mêmes valeurs, deux noms, aucun des
      # deux fichiers ne pouvant servir de référence à l'autre. Une barrière
      # trop étroite laisse passer la variante du défaut qu'elle vise.
      #
      # LA COQUE EST DÉSORMAIS COUVERTE, et c'est le vrai enjeu. Tant que
      # `ks-ui` n'affichait qu'un rapport, sa feuille de style tenait en
      # quelques règles. Depuis qu'elle porte le poste de pilotage, elle
      # recopie la moitié des tokens : c'est le troisième endroit du dépôt où
      # la même couleur est écrite, donc le troisième endroit où elle peut
      # dériver — et le seul des trois que l'utilisateur voit tous les jours.
      #
      # Les guillemets doubles sont acceptés au même titre que les simples :
      # `"Inter"` et `'Inter'` désignent la même police, et refuser l'un des
      # deux aurait fait passer les piles de la coque à travers le contrôle
      # sans qu'aucune erreur ne le signale — une barrière qui ne regarde pas
      # est pire qu'une barrière absente.
      - name: Les maquettes et la coque ne dérivent pas de design/tokens.css
        run: |
          divergences=0
          verifies=0
          # Le rapport HTML porte lui aussi une copie des jetons, dans une
          # constante Rust. C'était le TROISIÈME exemplaire, et le seul que ce
          # contrôle ne lisait pas — il divergeait déjà (`--font-mono` y avait
          # gagné 'Cascadia Mono'). Le motif de `grep` ne dépend pas de la
          # syntaxe du fichier, seulement de la forme `--nom: valeur;`, donc
          # rien n'empêchait de l'y appliquer.
          # `design/*.html` ne descend PAS dans les sous-dossiers : le motif
          # n'a pas d'étoile double, et `design/marque/index.html` échappait
          # donc au contrôle sans que rien ne le signale. Un garde-fou dont le
          # périmètre est plus étroit que son nom est un garde-fou qu'on croit
          # avoir. Le second niveau est explicite plutôt que récursif : on veut
          # savoir ce qu'on vérifie, pas ratisser.
          for source in design/*.html design/*/*.html                         ui/ks-ui/web/*.css ui/ks-ui/web/*.html                         crates/ks-cli/src/rapport.rs; do
            [ -e "$source" ] || continue
            while IFS='|' read -r nom valeur; do
              [ -z "$nom" ] && continue
              ref=$(grep -oE "^\s*${nom}\s*:\s*[^;]+;" design/tokens.css \
                    | head -1 | sed -E 's/.*:\s*//; s/\s*;$//')
              [ -z "$ref" ] && continue
              verifies=$((verifies + 1))
              # Comparaison insensible à la casse, aux espaces ET au style de
              # guillemets : `#EC5950` vaut `#ec5950`, `'Inter', system-ui`
              # vaut `"Inter",system-ui`. Aucun des trois n'est une divergence,
              # et les signaler en serait une, de fausse.
              norme_a=$(echo "$valeur" | tr 'A-Z' 'a-z' | tr -d '[:space:]' | tr -d "'\"")
              norme_b=$(echo "$ref"    | tr 'A-Z' 'a-z' | tr -d '[:space:]' | tr -d "'\"")
              if [ "$norme_a" != "$norme_b" ]; then
                echo "::error file=$source::$nom vaut $valeur ici et $ref dans design/tokens.css"
                divergences=1
              fi
            done <<< "$(grep -oE "^\s*--[a-z0-9-]+\s*:\s*(#[0-9A-Fa-f]{3,8}|['\"][^;]+)\s*;" "$source" \
                        | sed -E 's/^\s*//; s/\s*;$//; s/\s*:\s*/|/')"
          done
          if [ "$verifies" -eq 0 ]; then
            echo "::error::aucune variable comparée — le contrôle ne contrôle plus rien"
            exit 1
          fi
          echo "✓ $verifies variables comparées à design/tokens.css"
          exit $divergences
