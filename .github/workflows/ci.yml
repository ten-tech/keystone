name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Le jeton par défaut ne sert qu'à lire le dépôt. Chaque job qui a besoin de
# plus le déclare lui-même. Cohérence avec l'adversaire A4 du modèle de menace :
# un workflow trop permissif est une surface de chaîne d'approvisionnement.
permissions:
  contents: read

# Un push qui en remplace un autre annule le run devenu inutile.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # PAS de `RUSTFLAGS: "-D warnings"` ici, et c'est délibéré.
  #
  # Cargo transmet RUSTFLAGS à TOUTES les crates, dépendances comprises : un
  # simple `deprecated` chez un tiers ferait tomber toute la CI. Surtout, un
  # `-D warnings` global transforme en erreur le `unsafe_code = "warn"` que
  # docs/08-CONVENTIONS.md pose volontairement sur ks-collectors et ks-broker.
  # La Phase 0.2 (TPM, Secure Boot, BitLocker) est entièrement faite d'appels
  # `unsafe` au crate `windows` : la CI deviendrait rouge au premier bloc, et
  # la voie de moindre résistance serait un `#![allow(unsafe_code)]` global —
  # soit la neutralisation exacte du garde-fou.
  #
  # `-D warnings` reste appliqué à clippy, explicitement, sur NOTRE code seul.

# ─── Runners épinglés, et la dette que ça crée ──────────────────────────────
#
# `ubuntu-24.04` et `windows-2025` plutôt que `-latest`, pour la même raison que
# `Cargo.lock` et les SHA d'actions : un build reproductible ne dépend pas d'une
# étiquette qui bascule sans qu'aucun commit n'ait bougé. `devops.md` pose la
# règle — jamais `latest`.
#
# **Ce que ça coûte, et qu'il faut savoir.** Une image épinglée finit par être
# retirée : GitHub annonce la dépréciation puis programme des coupures avant la
# suppression. Et Dependabot ne suit PAS les étiquettes de runner — il ne couvre
# que les actions et les crates. Cette ligne-ci ne se met donc à jour que
# manuellement.
#
# À vérifier à chaque revue de dépendances, à la source :
#   https://github.com/actions/runner-images
#
# Au 2026-08-02 : `ubuntu-latest` désignait 24.04, `windows-latest` désignait
# Windows Server 2025. Épingler revient donc à figer l'état du jour, pas à
# rétrograder.

# ─── Toolchain Rust ─────────────────────────────────────────────────────────
#
# Aucun job ne déclare `targets:` ni `components:` : `rust-toolchain.toml` les
# gouverne et l'emporte de toute façon sur ce qu'installe l'action. Les déclarer
# aux deux endroits, c'était deux vérités pour une seule question — et la seconde
# ne servait à rien. Une déclaration, zéro dérive.
#
# **La révision de l'action doit rester alignée sur `rust-toolchain.toml`.**
# Vérifié à la source : cette action ne lit PAS `rust-toolchain.toml`. Avec une
# révision `@stable` et un fichier épinglé sur une version exacte, chaque job
# téléchargerait donc DEUX toolchains — celle de l'action, puis celle que rustup
# installe à la première invocation de cargo. Et `Swatinem/rust-cache` ne met pas
# `~/.rustup` en cache : le surcoût serait payé à chaque run, sur huit jobs.
#
# D'où la révision `1.97.1`, identique au fichier. C'est le seul endroit du dépôt
# où une version est écrite deux fois ; les deux se déplacent ensemble, ou pas
# du tout.
#
# Seul le job `msrv` s'en écarte, volontairement, via `cargo +1.85.0`.

jobs:
  # ── Le socle portable ──────────────────────────────────────────────────
  # ks-core, ks-collectors, ks-cli et ks-agent-linux compilent partout : c'est
  # ce qui rend cette étape rapide et exécutable sur un agent Linux. Elle garde
  # `main` vert sur l'essentiel sans attendre un agent Windows.
  portable:
    name: Socle portable (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # branche 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format
        run: cargo fmt --all --check

      # `--locked` : Cargo.lock est versionné, et la CI doit échouer s'il n'est
      # plus à jour plutôt que de le réécrire en silence. Sur un projet qui
      # livre un composant privilégié, une dépendance résolue à la volée est
      # une dépendance non tracée.
      - name: Clippy — aucun avertissement toléré
        run: cargo clippy --locked -p ks-core -p ks-collectors -p ks-cli -p ks-agent-linux --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked -p ks-core -p ks-collectors -p ks-cli -p ks-agent-linux

      - name: La CLI répond
        run: |
          cargo run --locked -q -p ks-cli -- status
          cargo run --locked -q -p ks-cli -- scan --json > /dev/null

  # ── La cible réelle du produit ─────────────────────────────────────────
  windows:
    name: Cible du produit (Windows, MSVC)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # branche 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Clippy sur tout le workspace, broker compris
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

      # Cette étape n'est pas décorative : elle isole les BARRIÈRES DE CONCEPTION
      # du broker (SEC-02 et SEC-03, critère A11) pour qu'un échec se lise d'un
      # coup d'œil, sans fouiller la sortie de tout le workspace.
      #
      # Elles sont **huit**, et elles ne se comptent pas au doigt mouillé : une
      # revue adverse a produit dix-neuf tentatives de contournement, dont douze
      # qu'elle a trouvées seule (voir docs/adr/0007). Chaque barrière ferme une
      # famille — délimitation, ancre, extraction, projection.
      #
      # L'étape ne citait qu'un seul de ces tests pendant toute la Phase 0, ce
      # qui est très exactement le défaut que ces barrières traquent : un
      # garde-fou qui garde moins que ce qu'il annonce.
      - name: Barrières SEC-02 et SEC-03 — l'API du broker reste fermée
        shell: bash
        run: |
          # Le chemin de module `tests::` est obligatoire avec `--exact`. Sans lui,
          # le filtre n'appariait AUCUN test : l'étape sortait en succès avec
          # « 0 passed; 2 filtered out ». Un garde-fou vert qui ne s'exécute pas
          # est pire qu'une absence de garde-fou — on lui fait confiance.
          barrieres=(
            aucun_verbe_ne_transporte_dexecution_arbitraire
            lenumeration_des_verbes_est_lisible_telle_quelle
            la_lecture_textuelle_voit_tous_les_verbes
            le_source_lu_porte_les_champs_du_type_compile
            aucune_variante_nenveloppe_sa_charge_utile
            tout_parametre_de_verbe_designe_un_ensemble_fini
            aucun_attribut_serde_ne_regle_la_projection
            une_exclusion_defender_exige_raison_et_expiration
          )
          echec=0
          for barriere in "${barrieres[@]}"; do
            # `|| true` : `shell: bash` implique `set -e`, donc un échec de cargo
            # interromprait la boucle AVANT le `echo`. Le jour où une barrière
            # casse — le seul jour où cette étape sert — le contributeur verrait
            # une étape rouge sans le message d'assertion qui lui dit quoi lire.
            sortie=$(cargo test --locked -p ks-broker \
              "tests::$barriere" -- --exact --nocapture 2>&1) || true
            echo "$sortie"
            # Et on vérifie que la barrière a bel et bien TOURNÉ : c'est ce
            # contrôle qui empêche de retomber dans le succès à vide, celui
            # qu'un nom de test mal orthographié produirait.
            if ! echo "$sortie" | grep -q "^test result: ok\. 1 passed"; then
              echo "::error::barrière « $barriere » : non exécutée, ou en échec"
              echec=1
            fi
          done
          exit "$echec"

  # ── L'agent Linux, tel qu'il est livré ─────────────────────────────────
  agent-musl:
    name: Agent Linux (musl statique)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # branche 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Compilation
        run: cargo build --locked -p ks-agent-linux --release --target x86_64-unknown-linux-musl

      - name: Vérifier que le binaire est bien statique
        run: |
          f=target/x86_64-unknown-linux-musl/release/ks-agent
          file "$f"
          readelf -l "$f" | grep -E "INTERP|Requesting" || true
          # Un agent lié dynamiquement échouerait sur une distro à glibc trop
          # ancienne — et on ne le découvrirait que chez l'utilisateur.
          #
          # Le critère est l'ABSENCE de segment PT_INTERP, pas la sortie de
          # `ldd` : la cible musl de Rust produit aujourd'hui un static-PIE
          # (ELF de type DYN), pour lequel `ldd` affiche « statically linked »
          # et non « not a dynamic executable ». Tester la chaîne rejetterait
          # donc un binaire parfaitement statique.
          if readelf -l "$f" | grep -q "INTERP"; then
            echo "::error::le binaire n'est pas statique (segment PT_INTERP présent)"
            exit 1
          fi
          echo "✓ aucun interpréteur de programme : binaire autonome"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ks-agent-musl
          path: target/x86_64-unknown-linux-musl/release/ks-agent

  # ── Le schéma et son exemple ───────────────────────────────────────────
  schema:
    name: Schéma workstation.yaml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # `rfc3339-validator` n'est pas cosmétique : en Draft 2020-12, `format`
      # est une simple annotation, et `jsonschema` ne vérifie `date-time` que si
      # ce paquet est présent. Sans lui, `decidedAt` du bloc acceptedDrift
      # passait sans contrôle alors que le job prétendait le valider.
      - run: pip install jsonschema pyyaml rfc3339-validator

      # Attrape notamment les pièges de typage implicite de YAML 1.1 :
      # `expires: 2026-09-01` devient une date, `boost: off` devient false.
      - name: Le schéma est valide et l'exemple s'y conforme
        run: |
          python - <<'EOF'
          import json, sys, yaml
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.load(open('schema/workstation.schema.json'))
          Draft202012Validator.check_schema(schema)
          v = Draft202012Validator(schema, format_checker=FormatChecker())
          doc = yaml.safe_load(open('schema/examples/workstation.yaml'))
          errs = sorted(v.iter_errors(doc), key=lambda e: list(e.path))
          for e in errs:
              print('::error::' + '/'.join(map(str, e.path)) + ' → ' + e.message)
          sys.exit(1 if errs else 0)
          EOF

  # ── La version minimale annoncée est-elle vraie ? ──────────────────────
  # `rust-version` dans Cargo.toml est une promesse faite aux contributeurs.
  # Sans ce job, elle n'est vérifiée par personne : la valeur initiale (1.80)
  # était fausse de cinq versions, et n'a été découverte qu'en compilant.
  #
  # `cargo +VERSION` est nécessaire : rust-toolchain.toml épingle « stable » et
  # l'emporterait autrement sur la toolchain installée par l'action.
  #
  # **La matrice n'est pas du confort.** Ce job ne tournait que sur Linux, et ne
  # compilait donc jamais une seule ligne de `#[cfg(windows)]` — c'est-à-dire
  # l'essentiel des deux collecteurs, et la totalité des crates Windows. La MSRV
  # était vérifiée partout sauf sur la plateforme qu'on livre. Un cas réel l'a
  # montré : le script de build de `libsqlite3-sys` 0.38 appelle `cfg_select!`,
  # stabilisée en Rust 1.95 ; la régression n'aurait été visible ni ici, ni chez
  # quiconque compile avec la toolchain épinglée.
  msrv:
    name: Version minimale (MSRV, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839 # branche 1.85.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Le workspace compile sur la MSRV déclarée
        run: cargo +1.85.0 check --locked --workspace --all-targets

  # ── Chaîne d'approvisionnement ─────────────────────────────────────────
  # Sur un composant privilégié, chaque crate ajoutée est une surface ajoutée
  # (voir docs/04-MODELE-DE-MENACE.md, adversaire A4).
  audit:
    name: Audit des dépendances
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # L'action publie son résultat sous forme de « check run ». Elle n'ouvre
      # d'issue que sur déclenchement `schedule`, que ce workflow n'a pas —
      # `issues: write` serait donc une permission accordée pour rien.
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── Licences, doublons, provenance ─────────────────────────────────────
  # docs/08-CONVENTIONS.md § « Dépendances » prescrit `cargo deny check`.
  # L'outil était demandé au développeur par scripts/dev-setup.ps1 sans qu'aucune
  # configuration ne l'accompagne : il ne servait à rien. La configuration est
  # maintenant dans deny.toml, à la racine.
  deny:
    name: Licences et provenance des dépendances
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

  # ── Cohérence de la documentation ──────────────────────────────────────
  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # « Un comportement non documenté est un défaut » : les documents cités
      # dans le README et l'index doivent exister.
      - name: Les documents référencés existent
        run: |
          manquants=0
          for f in \
            docs/00-INDEX.md docs/01-CAHIER-DES-CHARGES.md docs/02-BRIEF-DESIGN.md \
            docs/03-ARCHITECTURE.md docs/04-MODELE-DE-MENACE.md \
            docs/05-ENVIRONNEMENT-DE-DEV.md docs/06-VM-DE-LABO.md \
            docs/07-FEUILLE-DE-ROUTE.md docs/08-CONVENTIONS.md docs/09-GLOSSAIRE.md \
            docs/adr/TEMPLATE.md docs/adr/0001-rust-pour-le-broker.md \
            docs/adr/0002-grpc-sur-named-pipe.md docs/adr/0003-collecteurs-en-wasm.md \
            design/tokens.css design/palette-validation.md \
            design/keystone-cockpit.html schema/workstation.schema.json \
            schema/examples/workstation.yaml SECURITY.md deny.toml ; do
            [ -f "$f" ] || { echo "::error::document manquant : $f"; manquants=1; }
          done
          exit $manquants

      # Garde-fou de vocabulaire. Le glossaire proscrit ces formulations : elles
      # relèvent du dark pattern de la peur ou du charlatanisme (principe P9).
      #
      # Le second filtre écarte les lignes qui CITENT une formulation pour la
      # condamner — la documentation en contient beaucoup, et c'est sain.
      - name: Vocabulaire proscrit
        run: |
          # « détecte( \S+){0,2} intrusions? » et non « détecte (toute|toutes) les? intrusion » :
          # l'ancien motif exigeait la séquence impossible « détecte toute LES intrusion »
          # et ratait donc les deux formulations réelles — dont « Keystone détecte les
          # intrusions », que docs/09-GLOSSAIRE.md désigne pourtant comme LA phrase
          # à proscrire. Un garde-fou qui ne peut pas attraper son propre cas canonique
          # est une étape verte de plus. Vérifié empiriquement sur les cinq tournures.
          hits=$(grep -rniE "détecte( \S+){0,2} intrusions?|optimise votre (PC|système|machine)|accélérateur de (RAM|mémoire)|nettoyeur de registre" \
                   docs/ README.md 2>/dev/null \
                 | grep -viE "aucun|pas de|jamais|proscri|interdit|faux ami|refus|mensonge|dangereux" || true)
          # « » a été RETIRÉ de ce filtre inverse : les guillemets français sont la
          # typographie imposée du projet, donc n'importe quelle phrase en contenant
          # échappait au contrôle. Le garde-fou était désarmé par le style dans lequel
          # la documentation est écrite. Les citations légitimes restent écartées par
          # les mots qui les entourent (« faux ami », « dangereux », « jamais »…).
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::formulation proscrite — voir docs/09-GLOSSAIRE.md § Faux amis"
            exit 1
          fi
          echo "✓ aucune formulation proscrite employée à son compte"

      # Principe P5, « Local, point final » : aucune ressource réseau dans une
      # maquette ni dans un rapport. Ni CDN, ni Google Fonts, ni police distante.
      #
      # Cette règle était écrite depuis le premier commit, et **rien ne la
      # vérifiait** : les deux maquettes ont chargé trois familles Google Fonts
      # pendant toute la Phase 0. Une maquette d'outil de sécurité dont la thèse
      # est qu'il ne parle à personne, et qui annonce à un tiers qu'on l'ouvre :
      # c'est la contradiction la plus visible qu'on pouvait laisser.
      #
      # Le filtre écarte `http://www.w3.org/…`, qui est un espace de noms XML —
      # une chaîne d'identification qu'aucun navigateur ne va chercher — et le
      # dossier d'import, archive documentée par son propre README.
      - name: Aucune ressource réseau dans les maquettes
        run: |
          hits=$(grep -rnoE "https?://[^\"')[:space:]]+" design/ crates/ks-cli/src/rapport.rs 2>/dev/null \
                 | grep -v "www\.w3\.org" \
                 | grep -v "^design/import-claude-design/" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::ressource réseau dans une maquette ou un rapport — principe P5"
            exit 1
          fi
          echo "✓ aucune ressource réseau : les maquettes et le rapport s'ouvrent hors ligne"
